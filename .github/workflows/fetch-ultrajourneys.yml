# Downloads the ultrajourneys.org maps posts and their GPS tracks into research/ultrajourneys/ for
# reference (scripts/research/fetch-ultrajourneys.mjs) and commits them to the branch it ran on.
# Runs by hand, or when the script or this workflow changes on a claude/ branch.
name: Fetch ultrajourneys maps

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths:
      - scripts/research/fetch-ultrajourneys.mjs
      - .github/workflows/fetch-ultrajourneys.yml

permissions:
  contents: write

concurrency:
  group: fetch-ultrajourneys-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch
        run: node scripts/research/fetch-ultrajourneys.mjs 2>&1 | tee fetch.log

      - name: Summary
        if: always()
        run: |
          { echo '```'; cat fetch.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit
        run: |
          git config user.name "Trail to Tides"
          git config user.email "hello@trailtotides.com"
          git add research/ultrajourneys
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Research: ultrajourneys.org maps posts and tracks, fetched on GitHub Actions" -m "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # A trail build may be committing to the branch too
          for i in 1 2 3 4 5; do git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin HEAD:"$GITHUB_REF_NAME" && exit 0; sleep 10; done
          exit 1
