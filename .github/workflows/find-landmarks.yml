# Looks up the named places around camps and summits that need placing (scripts/research/
# find-landmarks.mjs) and commits research/landmarks.json to the branch it ran on.
name: Find landmarks

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths:
      - scripts/research/find-landmarks.mjs
      - scripts/research/landmarks.json
      - .github/workflows/find-landmarks.yml

permissions:
  contents: write

concurrency:
  group: find-landmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Find
        timeout-minutes: 75
        continue-on-error: true
        run: node scripts/research/find-landmarks.mjs 2>&1 | tee find.log

      - name: Summary
        if: always()
        run: |
          { echo '```'; cat find.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit
        if: always()
        run: |
          git config user.name "Trail to Tides"
          git config user.email "hello@trailtotides.com"
          git add -f research/landmarks.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Research: named places around camps and summits to place [skip ci]" -m "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          for i in 1 2 3 4 5; do git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin HEAD:"$GITHUB_REF_NAME" && exit 0; sleep 10; done
          exit 1
